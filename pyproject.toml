[project]
name = "nosh"
version = "0.1.0"
description = "A grounded recipe chatbot over the Recipe Box dataset"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "anthropic>=2.6.0",
    "duckdb>=2.0.0",
    "google-genai>=3.0.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "streamlit>=1.67.0",
]

[project.scripts]
nosh = "nosh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nosh"]
